<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Pembelajaran IPS</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#1e293b',
              primary: '#2563eb',
              accent: '#059669',
              gold: '#d97706'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- ================= LOGGING IN / LOADING OVERLAY ================= -->
  <div id="loading-overlay" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex flex-col items-center justify-center text-white">
    <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-3 text-blue-400"></i>
    <p id="loading-text" class="font-medium text-sm">Memproses data...</p>
  </div>

  <!-- ================= HALAMAN LOGIN ================= -->
  <div id="login-section" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden border border-slate-200">
      
      <!-- Header Login -->
      <div class="bg-gradient-to-r from-slate-900 to-blue-900 p-6 text-center text-white">
        <div class="w-16 h-16 bg-blue-500/20 rounded-full flex items-center justify-center mx-auto mb-3 border border-blue-400/30">
          <i class="fa-solid fa-earth-americas text-3xl text-blue-300"></i>
        </div>
        <h1 class="text-xl font-bold tracking-wide">Portal Pembelajaran IPS</h1>
        <p class="text-xs text-blue-200 mt-1">Sistem Informasi Absensi, Nilai & Materi IPS</p>
      </div>

      <!-- Tab Switcher Login -->
      <div class="flex border-b border-slate-200 bg-slate-50">
        <button id="tab-siswa-btn" onclick="switchLoginTab('siswa')" class="flex-1 py-3 text-sm font-semibold border-b-2 border-blue-600 text-blue-600 transition-all">
          <i class="fa-solid fa-user-graduate mr-1"></i> Login Siswa
        </button>
        <button id="tab-guru-btn" onclick="switchLoginTab('guru')" class="flex-1 py-3 text-sm font-semibold text-slate-500 border-b-2 border-transparent transition-all">
          <i class="fa-solid fa-chalkboard-user mr-1"></i> Login Guru
        </button>
      </div>

      <!-- Form Login Siswa -->
      <div id="form-siswa" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">USERNAME SISWA</label>
          <input type="text" id="siswa-username" placeholder="Contoh: ardian sandy 15101989" 
                 class="w-full px-4 py-3 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          <p class="text-[11px] text-slate-400 mt-1">Kombinasi Nama Lengkap + Tanggal Lahir (DDMMYYYY) tanpa spasi atau dengan spasi.</p>
        </div>
        <button onclick="loginSiswa()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg text-sm shadow-md transition-all">
          Masuk sebagai Siswa
        </button>
      </div>

      <!-- Form Login Guru -->
      <div id="form-guru" class="p-6 space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">USERNAME GURU</label>
          <input type="text" id="guru-username" placeholder="Username guru" 
                 class="w-full px-4 py-3 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">PASSWORD</label>
          <input type="password" id="guru-password" placeholder="Password guru" 
                 class="w-full px-4 py-3 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <button onclick="loginGuru()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 rounded-lg text-sm shadow-md transition-all">
          Masuk sebagai Guru
        </button>
      </div>

    </div>
  </div>

  <!-- ================= DASHBOARD MAIN CONTAINER ================= -->
  <div id="app-dashboard" class="hidden min-h-screen flex flex-col">
    
    <!-- Navbar Top -->
    <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
      <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <i class="fa-solid fa-earth-asia text-xl text-blue-400"></i>
          <div>
            <h2 class="font-bold text-sm tracking-wide leading-none">Ruang IPS</h2>
            <span id="user-info-badge" class="text-[11px] text-slate-400">Loading...</span>
          </div>
        </div>
        <button onclick="logout()" class="text-xs bg-red-500/20 hover:bg-red-500/30 text-red-300 border border-red-500/40 px-3 py-1.5 rounded-lg flex items-center gap-1 transition-all">
          <i class="fa-solid fa-right-from-bracket"></i> Keluar
        </button>
      </div>
    </header>

    <!-- Content Area Guru -->
    <main id="view-guru" class="hidden flex-1 max-w-5xl w-full mx-auto p-4 space-y-4">
      <!-- Selector Kelas -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-3">
        <label class="text-sm font-bold text-slate-700 flex items-center gap-2">
          <i class="fa-solid fa-users-rectangle text-blue-600"></i> Pilih Kelas Management:
        </label>
        <select id="guru-kelas-select" onchange="loadDataKelasGuru()" class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-semibold bg-slate-50 focus:ring-2 focus:ring-blue-500">
          <option value="7a">Kelas 7A</option>
          <option value="7b">Kelas 7B</option>
          <option value="9a">Kelas 9A</option>
          <option value="9b">Kelas 9B</option>
          <option value="9c">Kelas 9C</option>
          <option value="9d">Kelas 9D</option>
        </select>
      </div>

      <!-- Menu Navigation Guru -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
        <button onclick="switchGuruTab('absensi')" id="btn-guru-absensi" class="guru-nav-btn p-3 bg-blue-600 text-white rounded-xl text-xs font-semibold text-center shadow">
          <i class="fa-solid fa-calendar-check text-lg block mb-1"></i> Absensi Cepat
        </button>
        <button onclick="switchGuruTab('nilai')" id="btn-guru-nilai" class="guru-nav-btn p-3 bg-white text-slate-700 rounded-xl text-xs font-semibold text-center border shadow-sm">
          <i class="fa-solid fa-pen-to-square text-lg block mb-1 text-emerald-600"></i> Input Nilai
        </button>
        <button onclick="switchGuruTab('sikap')" id="btn-guru-sikap" class="guru-nav-btn p-3 bg-white text-slate-700 rounded-xl text-xs font-semibold text-center border shadow-sm">
          <i class="fa-solid fa-star text-lg block mb-1 text-amber-500"></i> Bintang Sikap
        </button>
        <button onclick="switchGuruTab('materi')" id="btn-guru-materi" class="guru-nav-btn p-3 bg-white text-slate-700 rounded-xl text-xs font-semibold text-center border shadow-sm">
          <i class="fa-solid fa-file-arrow-up text-lg block mb-1 text-indigo-600"></i> Upload Materi
        </button>
      </div>

      <!-- Content Section Guru -->
      <div id="guru-tab-content" class="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-200">
        <!-- Rendered dynamically by JS -->
      </div>
    </main>

    <!-- Content Area Siswa -->
    <main id="view-siswa" class="hidden flex-1 max-w-5xl w-full mx-auto p-4 space-y-4">
      <!-- Card Welcome & Stats -->
      <div class="bg-gradient-to-r from-blue-900 to-slate-800 rounded-xl p-5 text-white shadow-md relative overflow-hidden">
        <div class="relative z-10">
          <span class="text-xs font-semibold bg-blue-500/30 border border-blue-400/30 px-2.5 py-1 rounded-full">Siswa IPS</span>
          <h2 id="siswa-welcome-name" class="text-xl font-bold mt-2">Selamat Datang!</h2>
          <p id="siswa-welcome-class" class="text-xs text-blue-200">Kelas --</p>
        </div>
        <div class="absolute right-4 bottom-2 opacity-20 text-7xl">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
      </div>

      <!-- Quick Stats -->
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
          <div>
            <p class="text-xs text-slate-500">Bintang Keaktifan</p>
            <p id="stat-bintang" class="text-2xl font-black text-amber-500">0 ★</p>
          </div>
          <i class="fa-solid fa-award text-3xl text-amber-100"></i>
        </div>
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
          <div>
            <p class="text-xs text-slate-500">Total Kehadiran</p>
            <p id="stat-kehadiran" class="text-2xl font-black text-emerald-600">0 Harian</p>
          </div>
          <i class="fa-solid fa-clipboard-user text-3xl text-emerald-100"></i>
        </div>
      </div>

      <!-- Tab Menu Siswa -->
      <div class="flex border-b border-slate-200 bg-white rounded-t-xl px-2">
        <button onclick="switchSiswaTab('nilai')" id="btn-siswa-nilai" class="siswa-nav-btn py-3 px-4 text-xs font-bold border-b-2 border-blue-600 text-blue-600">
          <i class="fa-solid fa-chart-line mr-1"></i> Nilai Saya
        </button>
        <button onclick="switchSiswaTab('materi')" id="btn-siswa-materi" class="siswa-nav-btn py-3 px-4 text-xs font-bold text-slate-500 border-b-2 border-transparent">
          <i class="fa-solid fa-book-open mr-1"></i> Materi & Video
        </button>
        <button onclick="switchSiswaTab('tugas')" id="btn-siswa-tugas" class="siswa-nav-btn py-3 px-4 text-xs font-bold text-slate-500 border-b-2 border-transparent">
          <i class="fa-solid fa-upload mr-1"></i> Kirim Tugas
        </button>
      </div>

      <div id="siswa-tab-content" class="bg-white p-4 md:p-6 rounded-b-xl shadow-sm border border-slate-200">
        <!-- Rendered dynamically by JS -->
      </div>
    </main>

  </div>

  <!-- Include App Logic JS -->
  <script src="app.js"></script>
</body>
</html>
